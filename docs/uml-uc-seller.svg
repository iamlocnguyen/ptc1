<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="100%" height="100%">
    <rect width="700" height="410" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="210" y="30" width="390" height="350" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="225" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="225" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Phân hệ Quản lý Quán ăn (Seller)</text>
    <line x1="85" y1="210" x2="275" y2="115" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="210" x2="270" y2="170" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="210" x2="285" y2="225" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="210" x2="275" y2="280" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="210" x2="285" y2="335" stroke="#000000" stroke-width="1.3"/>
    <!-- UseCase: Tạo quán ăn mới (Create) -->
    <g>
        <ellipse cx="405" cy="115" rx="130" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="405" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tạo quán ăn mới (Create)</text>
    </g>
    <!-- UseCase: Xem danh sách quán của mình -->
    <g>
        <ellipse cx="405" cy="170" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="405" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem danh sách quán của mình</text>
    </g>
    <!-- UseCase: Xem chi tiết quán ăn -->
    <g>
        <ellipse cx="405" cy="225" rx="120" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="405" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem chi tiết quán ăn</text>
    </g>
    <!-- UseCase: Cập nhật thông tin quán ăn -->
    <g>
        <ellipse cx="405" cy="280" rx="130" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="405" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Cập nhật thông tin quán ăn</text>
    </g>
    <!-- UseCase: Xóa quán ăn (Delete) -->
    <g>
        <ellipse cx="405" cy="335" rx="120" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="405" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xóa quán ăn (Delete)</text>
    </g>
    <!-- Actor: Seller -->
    <g>
        <circle cx="85" cy="175" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="187" x2="85" y2="213" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="197" x2="103" y2="197" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="213" x2="71" y2="235" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="213" x2="99" y2="235" stroke="#000000" stroke-width="2"/>
        <text x="85" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Seller</text>
        <text x="85" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Chủ quán ăn</text>
    </g>
</svg>