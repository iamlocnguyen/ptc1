<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
    <rect width="760" height="440" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="210" y="30" width="370" height="380" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="225" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="225" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Phân hệ Xác thực &amp; Tài khoản</text>
    <line x1="85" y1="150" x2="275" y2="115" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="150" x2="270" y2="235" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="290" x2="275" y2="175" stroke="#000000" stroke-width="1.3"/><line x1="675" y1="210" x2="520" y2="295" stroke="#000000" stroke-width="1.3"/><line x1="675" y1="340" x2="520" y2="355" stroke="#000000" stroke-width="1.3"/>
    <!-- UseCase: Đăng ký tài khoản User -->
    <g>
        <ellipse cx="395" cy="115" rx="120" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng ký tài khoản User</text>
    </g>
    <!-- UseCase: Đăng nhập tài khoản User -->
    <g>
        <ellipse cx="395" cy="175" rx="120" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập tài khoản User</text>
    </g>
    <!-- UseCase: Đăng ký tài khoản Seller -->
    <g>
        <ellipse cx="395" cy="235" rx="125" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng ký tài khoản Seller</text>
    </g>
    <!-- UseCase: Đăng nhập tài khoản Seller -->
    <g>
        <ellipse cx="395" cy="295" rx="125" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập tài khoản Seller</text>
    </g>
    <!-- UseCase: Đăng nhập tài khoản Admin -->
    <g>
        <ellipse cx="395" cy="355" rx="125" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập tài khoản Admin</text>
    </g>
    <!-- Actor: Guest -->
    <g>
        <circle cx="85" cy="115" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="127" x2="85" y2="153" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="137" x2="103" y2="137" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="153" x2="71" y2="175" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="153" x2="99" y2="175" stroke="#000000" stroke-width="2"/>
        <text x="85" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Guest</text>
        <text x="85" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách vãng lai</text>
    </g>
    <!-- Actor: User -->
    <g>
        <circle cx="85" cy="255" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="267" x2="85" y2="293" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="277" x2="103" y2="277" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="293" x2="71" y2="315" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="293" x2="99" y2="315" stroke="#000000" stroke-width="2"/>
        <text x="85" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User</text>
        <text x="85" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách hàng</text>
    </g>
    <!-- Actor: Seller -->
    <g>
        <circle cx="675" cy="175" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="187" x2="675" y2="213" stroke="#000000" stroke-width="2"/>
        <line x1="657" y1="197" x2="693" y2="197" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="213" x2="661" y2="235" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="213" x2="689" y2="235" stroke="#000000" stroke-width="2"/>
        <text x="675" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Seller</text>
        <text x="675" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Người bán</text>
    </g>
    <!-- Actor: Admin -->
    <g>
        <circle cx="675" cy="305" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="317" x2="675" y2="343" stroke="#000000" stroke-width="2"/>
        <line x1="657" y1="327" x2="693" y2="327" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="343" x2="661" y2="365" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="343" x2="689" y2="365" stroke="#000000" stroke-width="2"/>
        <text x="675" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="675" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị viên</text>
    </g>
</svg>