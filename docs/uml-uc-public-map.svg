<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
    <rect width="820" height="460" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="210" y="30" width="410" height="400" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="225" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="225" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Khám phá Quán ăn &amp; Dịch vụ Bản đồ</text>
    <line x1="85" y1="230" x2="275" y2="115" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="230" x2="295" y2="170" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="230" x2="280" y2="225" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="230" x2="285" y2="280" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="230" x2="275" y2="335" stroke="#000000" stroke-width="1.3"/><line x1="85" y1="230" x2="275" y2="390" stroke="#000000" stroke-width="1.3"/><line x1="720" y1="360" x2="555" y2="335" stroke="#000000" stroke-width="1.3"/><line x1="720" y1="360" x2="555" y2="390" stroke="#000000" stroke-width="1.3"/>
    <!-- UseCase: Xem danh sách quán ăn công khai -->
    <g>
        <ellipse cx="415" cy="115" rx="140" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem danh sách quán ăn công khai</text>
    </g>
    <!-- UseCase: Xem chi tiết quán ăn -->
    <g>
        <ellipse cx="415" cy="170" rx="120" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem chi tiết quán ăn</text>
    </g>
    <!-- UseCase: Tìm quán ăn gần đây (PostGIS) -->
    <g>
        <ellipse cx="415" cy="225" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tìm quán ăn gần đây (PostGIS)</text>
    </g>
    <!-- UseCase: Tính khoảng cách tới quán ăn -->
    <g>
        <ellipse cx="415" cy="280" rx="130" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tính khoảng cách tới quán ăn</text>
    </g>
    <!-- UseCase: Tìm địa điểm theo từ khóa (Geocoding) -->
    <g>
        <ellipse cx="415" cy="335" rx="140" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tìm địa điểm theo từ khóa (Geocoding)</text>
    </g>
    <!-- UseCase: Tra cứu địa chỉ từ tọa độ (Reverse) -->
    <g>
        <ellipse cx="415" cy="390" rx="140" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="415" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tra cứu địa chỉ từ tọa độ (Reverse)</text>
    </g>
    <!-- Actor: User / Guest -->
    <g>
        <circle cx="85" cy="195" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="207" x2="85" y2="233" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="217" x2="103" y2="217" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="233" x2="71" y2="255" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="233" x2="99" y2="255" stroke="#000000" stroke-width="2"/>
        <text x="85" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User / Guest</text>
        <text x="85" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách hàng</text>
    </g>
    <!-- External System: OpenStreetMap -->
    <g>
        <rect x="665" y="338" width="110" height="46" fill="#F8F9FA" stroke="#000000" stroke-width="1.8" rx="4"/>
        <text x="720" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#555555">«external service»</text>
        <text x="720" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">OpenStreetMap</text>
    </g>
</svg>