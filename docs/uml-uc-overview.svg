<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" height="100%">
    <rect width="860" height="560" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="220" y="30" width="410" height="500" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="235" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="235" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000">Hệ thống PTC1 (Backend FastAPI)</text>
    <line x1="90" y1="130" x2="290" y2="115" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="130" x2="285" y2="235" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="130" x2="290" y2="295" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="130" x2="290" y2="415" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="270" x2="290" y2="175" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="270" x2="285" y2="235" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="270" x2="290" y2="295" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="270" x2="295" y2="355" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="270" x2="290" y2="415" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="440" x2="290" y2="115" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="440" x2="290" y2="175" stroke="#000000" stroke-width="1.3"/><line x1="90" y1="440" x2="290" y2="475" stroke="#000000" stroke-width="1.3"/><line x1="760" y1="175" x2="560" y2="175" stroke="#000000" stroke-width="1.3"/><line x1="760" y1="415" x2="560" y2="415" stroke="#000000" stroke-width="1.3"/>
    <!-- UseCase: Đăng ký tài khoản (User / Seller) -->
    <g>
        <ellipse cx="425" cy="115" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng ký tài khoản (User / Seller)</text>
    </g>
    <!-- UseCase: Đăng nhập (User / Seller / Admin) -->
    <g>
        <ellipse cx="425" cy="175" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập (User / Seller / Admin)</text>
    </g>
    <!-- UseCase: Xem danh sách & Chi tiết quán ăn -->
    <g>
        <ellipse cx="425" cy="235" rx="140" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem danh sách & Chi tiết quán ăn</text>
    </g>
    <!-- UseCase: Tìm quán ăn gần đây (PostGIS) -->
    <g>
        <ellipse cx="425" cy="295" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tìm quán ăn gần đây (PostGIS)</text>
    </g>
    <!-- UseCase: Tính khoảng cách tới quán ăn -->
    <g>
        <ellipse cx="425" cy="355" rx="130" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tính khoảng cách tới quán ăn</text>
    </g>
    <!-- UseCase: Tra cứu địa điểm & Tọa độ bản đồ -->
    <g>
        <ellipse cx="425" cy="415" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tra cứu địa điểm & Tọa độ bản đồ</text>
    </g>
    <!-- UseCase: Quản lý Quán ăn (CRUD - Seller) -->
    <g>
        <ellipse cx="425" cy="475" rx="135" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="425" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản lý Quán ăn (CRUD - Seller)</text>
    </g>
    <!-- Actor: Guest -->
    <g>
        <circle cx="90" cy="95" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="107" x2="90" y2="133" stroke="#000000" stroke-width="2"/>
        <line x1="72" y1="117" x2="108" y2="117" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="133" x2="76" y2="155" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="133" x2="104" y2="155" stroke="#000000" stroke-width="2"/>
        <text x="90" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Guest</text>
        <text x="90" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách vãng lai</text>
    </g>
    <!-- Actor: User -->
    <g>
        <circle cx="90" cy="235" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="247" x2="90" y2="273" stroke="#000000" stroke-width="2"/>
        <line x1="72" y1="257" x2="108" y2="257" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="273" x2="76" y2="295" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="273" x2="104" y2="295" stroke="#000000" stroke-width="2"/>
        <text x="90" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User</text>
        <text x="90" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách hàng</text>
    </g>
    <!-- Actor: Seller -->
    <g>
        <circle cx="90" cy="405" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="417" x2="90" y2="443" stroke="#000000" stroke-width="2"/>
        <line x1="72" y1="427" x2="108" y2="427" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="443" x2="76" y2="465" stroke="#000000" stroke-width="2"/>
        <line x1="90" y1="443" x2="104" y2="465" stroke="#000000" stroke-width="2"/>
        <text x="90" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Seller</text>
        <text x="90" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Chủ quán ăn</text>
    </g>
    <!-- Actor: Admin -->
    <g>
        <circle cx="760" cy="140" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="760" y1="152" x2="760" y2="178" stroke="#000000" stroke-width="2"/>
        <line x1="742" y1="162" x2="778" y2="162" stroke="#000000" stroke-width="2"/>
        <line x1="760" y1="178" x2="746" y2="200" stroke="#000000" stroke-width="2"/>
        <line x1="760" y1="178" x2="774" y2="200" stroke="#000000" stroke-width="2"/>
        <text x="760" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="760" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị viên</text>
    </g>
    <!-- External System: OpenStreetMap -->
    <g>
        <rect x="705" y="393" width="110" height="46" fill="#F8F9FA" stroke="#000000" stroke-width="1.8" rx="4"/>
        <text x="760" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#555555">«external service»</text>
        <text x="760" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">OpenStreetMap</text>
    </g>
</svg>